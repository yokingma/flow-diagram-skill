name: Independent Skill regression and consumer acceptance

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '*.ts'
      - '*.mjs'
      - '*.cjs'
      - '.npmrc'
      - '.gitignore'
      - '.github/workflows/**'
  push:
    paths:
      - 'skills/**'
      - 'tests/**'
      - 'scripts/**'
      - 'examples/**'
      - 'docs/**'
      - '*.md'
      - '*.json'
      - '*.yaml'
      - '*.yml'
      - '*.ts'
      - '*.mjs'
      - '*.cjs'
      - '.npmrc'
      - '.gitignore'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18
      - name: Locate real unsupported Node runtime
        id: node18
        shell: node {0}
        run: |
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `path=${process.execPath}\n`);
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser preparation belongs to the runner. The installed CLI never installs browsers.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Exercise every regression with the prepared browser
        env:
          FLOWSVG_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          FLOWSVG_TEST_NODE18: ${{ steps.node18.outputs.path }}
        run: pnpm test:skill --maxWorkers=1 --reporter=default --reporter=json --outputFile=acceptance/regression-results.json
      - name: Exercise the external installation through its public CLI
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        shell: node {0}
        env:
          FLOWSVG_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          FLOWSVG_TEST_NODE18: ${{ steps.node18.outputs.path }}
        run: |
          const result = require('node:child_process').spawnSync(process.execPath, ['scripts/verify-authoring-skill.mjs', '--output', 'acceptance/evidence.json'], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
      # Windows graceful Ctrl+C remains unverified; the consumer gate reports incomplete.
      # Do not turn incomplete platform evidence into a successful acceptance result.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: skill-acceptance-${{ matrix.os }}-node${{ matrix.node }}
          path: acceptance/*.json
          if-no-files-found: error
