<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagram explanation</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; --diagram-reading-width: 720px; }
body { margin: 0; background: #f7f9fb; color: #192c3d; }
main { max-width: 1120px; margin: auto; padding: 32px 24px; }
h1 { margin: 0 0 12px; font-size: clamp(28px, 4vw, 40px); line-height: 1.2; overflow-wrap: anywhere; }
p { line-height: 1.65; }
header { margin-bottom: 24px; }
.explanation { margin-top: 24px; max-width: 72ch; }
.diagram-scroll { max-width: 100%; overflow-x: auto; }
.diagram-scroll:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
#flowsvg-page-player { min-width: var(--diagram-reading-width); }
.reading-hint { font-size: 14px; }
@media (max-width: 600px) { main { padding: 24px 16px; } }
@media (prefers-color-scheme: dark) { body { background: #101820; color: #e7edf4; } }
</style>
</head>
<body>
<main>
<header>
<h1>Diagram explanation</h1>
<p>Replace with a short introduction, or remove this paragraph.</p>
</header>
<p class="reading-hint" id="diagram-reading-hint">On a narrow screen, scroll the diagram area horizontally to read the whole diagram and reach its controls.</p>
<section class="diagram-scroll" aria-label="Interactive diagram" aria-describedby="diagram-reading-hint" tabindex="0">

</section>
<section class="explanation" aria-label="Supporting explanation">
<p>Replace with source-supported context, assumptions or limits, or remove this section.</p>
</section>
</main>
</body>
</html>
